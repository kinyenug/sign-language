<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수어 단어장</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== 로그인 / 회원가입 화면 ===================== -->
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1>🤟 수어 단어장</h1>
      <p class="auth-sub">로그인하고 수어 단어 영상을 검색해보세요.</p>

      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">로그인</button>
        <button class="tab-btn" data-tab="signup">회원가입</button>
      </div>

      <!-- 로그인 폼 -->
      <form id="login-form" class="auth-form">
        <label>이메일
          <input type="email" id="login-email" required autocomplete="email" />
        </label>
        <label>비밀번호
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn-primary">로그인</button>
        <p class="auth-error" id="login-error"></p>
      </form>

      <!-- 회원가입 폼 -->
      <form id="signup-form" class="auth-form hidden">
        <label>이름
          <input type="text" id="signup-name" required autocomplete="name" />
        </label>
        <label>이메일
          <input type="email" id="signup-email" required autocomplete="email" />
        </label>
        <label>비밀번호 (6자 이상)
          <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn-primary">회원가입</button>
        <p class="auth-error" id="signup-error"></p>
      </form>

      <div class="auth-divider"><span>또는</span></div>

      <button id="google-login-btn" class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.9c1.7-1.57 2.7-3.88 2.7-6.64z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.69A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.16.27-1.69V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.82.95 4.03l3-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.95 4.97l3 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Google 계정으로 계속하기
      </button>
      <p class="auth-error" id="google-error"></p>
    </div>
  </section>

  <!-- ===================== 메인 단어장 화면 (로그인 후) ===================== -->
  <section id="app-screen" class="app-screen hidden">
    <header class="app-header">
      <h1>🤟 수어 단어장</h1>
      <div class="user-box">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn-ghost">로그아웃</button>
      </div>
    </header>

    <div class="toolbar">
      <input type="search" id="search-input" placeholder="단어 검색 (예: 안녕하세요)" />
      <select id="category-filter">
        <option value="">전체 카테고리</option>
      </select>
      <button id="refresh-btn" class="btn-ghost" title="새 단어를 방금 올리셨다면 눌러주세요">🔄 새로고침</button>
    </div>

    <p id="result-count" class="result-count"></p>

    <div id="word-grid" class="word-grid"></div>
    <p id="empty-message" class="empty-message hidden">등록된 단어가 없거나 검색 결과가 없습니다.</p>
  </section>

  <!-- ===================== 영상 재생 모달 ===================== -->
  <div id="video-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <h2 id="modal-word"></h2>
      <p id="modal-category" class="modal-category"></p>
      <div class="video-wrapper">
        <iframe id="modal-video" src="" title="수어 단어 영상"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat 버전 - 스크립트 태그만으로 사용 가능) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
